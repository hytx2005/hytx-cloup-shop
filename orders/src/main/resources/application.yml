server:
  port: 8081

spring:
  application:
    name: orders-service
  config:
    import: nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        namespace: ${cloud.nacos.namespace}
      server-addr: ${nacos.address}
      config:
          file-extension: yaml
  # 数据库连接池配置
  datasource:
    url: jdbc:mysql://${cs.db.host}:3306/${cs.db.name}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${cs.db.user}
    password: ${cs.db.pwd}
  profiles:
    active: dev


# OpenFeign configuration
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
          carts-service:
            connect-timeout: 3000
            read-timeout: 3000
          products-service:
            connect-timeout: 3000
            read-timeout: 3000



mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.cehnzhihao.users.domain.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto


logging:
  level:
    root: INFO
    com.example.orders: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos: WARN