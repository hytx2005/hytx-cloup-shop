server:
  port: 8081

spring:
  application:
    name: orders-service
  config:
    import: nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        namespace: ${cloud.nacos.namespace}
      server-addr: ${nacos.address}
      config:
          file-extension: yaml
  # 数据库连接池配置
  datasource:
    url: jdbc:mysql://${cs.db.host}:3306/${cs.db.name}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${cs.db.user}
    password: ${cs.db.pwd}
  profiles:
    active: dev

  # kafka相关配置
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:122.51.149.223:9092}
    producer:
      retries: 3 #设置大于0，会将发送失败的记录重新发送
      batch-size: 16384
      buffer-memory: 33554432
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: default-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500

    listener:
      ack-mode: manual_immediate

# OpenFeign configuration
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
          carts-service:
            connect-timeout: 3000
            read-timeout: 3000
          products-service:
            connect-timeout: 3000
            read-timeout: 3000



mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.cehnzhihao.users.domain.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto


logging:
  level:
    root: INFO
    com.example.orders: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos: WARN