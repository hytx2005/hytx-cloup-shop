server:
  port: 8081

spring:
  application:
    name: orders-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
  # 数据库连接池配置
  datasource:
    url: jdbc:mysql://${cs.db.host}:3306/${cs.db.name}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${cs.db.user}
    password: ${cs.db.pwd}

# 激活默认profile（可选）
spring.profiles.active: dev

profiles:
  active: dev # 激活开发环境配置

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.cehnzhihao.users.domain.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.orders: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos: WARN