server:
  port: 8083

spring:
  application:
    name: products-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.products: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos: WARN