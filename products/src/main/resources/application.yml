server:
  port: 8083

spring:
  application:
    name: products-service
  config:
    import: nacos:${spring.application.name}
  cloud:
    nacos:
      server-addr: ${nacos.address}
      config:
        file-extension: yaml
  # 数据库连接池配置
  datasource:
    url: jdbc:mysql://${cs.db.host}:3306/${cs.db.name}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${cs.db.user}
    password: ${cs.db.pwd}
  profiles:
    active: dev


# kafka相关配置
  kafka:
    bootstrap-servers: 117.72.116.151:9092
    producer:
      retries: 3 #设置大于0，会将发送失败的记录重新发送
      batch-size: 16384
      buffer-memory: 33554432
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: default-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500

    listener:
      ack-mode: manual_immediate

  redis:
    host: 117.72.124.24
    port: 6379
# dubbo + nacos 服务注册发现
nacos:
  address: 121.43.197.241:8848
  #  117.72.124.24:8849
dubbo:
  protocol:
    port: -1
  consumer:
    check: false
  registry:
    address: nacos://${nacos.address}?username=nacos&password=nacos
    register-mode: instance
  application:
    qos-enable: off
    name: ${spring.application.name}



mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.cehnzhihao.users.domain.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto



logging:
  level:
    root: INFO
    com.example.products: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos: WARN